spring:
  application:
    name: kampive-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: kampive
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 92MB
      file-size-threshold: 0
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  verification:
    confirm-url: ${EMAIL_VERIFICATION_URL:}
  email:
    brevo:
      api-key: ${BREVO_API_KEY:}
    sender-email: ${EMAIL_SENDER_ADDRESS:contact@kampive.app}
    sender-name: ${EMAIL_SENDER_NAME:Kampive}
  recovery:
    reset-url: ${RECOVERY_RESET_URL:}
    logo-url: ${EMAIL_LOGO_URL:}
    support-url: ${EMAIL_SUPPORT_URL:}
    token-key: ${RECOVERY_TOKEN_KEY:}
    poll-ms: 5000
  documentation:
    enabled: false
springdoc:
  api-docs:
    enabled: ${app.documentation.enabled}
  swagger-ui:
    enabled: ${app.documentation.enabled}
    disable-swagger-default-url: true
    validator-url: ""
  show-actuator: false
