spring:
  application:
    name: kampive-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: kampive
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: false
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  documentation:
    enabled: false
springdoc:
  api-docs:
    enabled: ${app.documentation.enabled}
  swagger-ui:
    enabled: ${app.documentation.enabled}
    disable-swagger-default-url: true
    validator-url: ""
  show-actuator: false
